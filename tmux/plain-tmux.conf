# claude-tmux plain tmux window status colors
# For users without oh-my-tmux. Source from ~/.tmux.conf.
# Tested with tmux >= 3.2.
#
# For oh-my-tmux users, see oh-my-tmux.conf instead.

# Required settings (also in settings.conf — only need one copy)
set -g automatic-rename on
set -g bell-action any
set -g visual-bell off
set -g visual-activity off
set -g visual-silence off

# Window status formats with per-state colors
# Remove #{?window_bell_flag,!,} to prevent "! title !" redundancy.
set -g window-status-format \
  '#I #{?#{m/r:^▶,#W},#[fg=colour75],#{?#{m/r:^✓,#W},#[fg=colour76],#{?#{m/r:^!,#W},#[fg=colour196],#{?#{m/r:^?,#W},#[fg=colour220],#{?#{m/r:^■,#W},#[fg=colour239],#{?#{m/r:^↩,#W},#[fg=colour141],#{?#{m/r:^·,#W},#[fg=colour244],#[fg=default]}}}}}}}#W#{?window_zoomed_flag, Z,}#[default] '

set -g window-status-current-format \
  '#I #{?#{m/r:^▶,#W},#[fg=colour75,bold],#{?#{m/r:^✓,#W},#[fg=colour156,bold],#{?#{m/r:^!,#W},#[fg=colour210,bold],#{?#{m/r:^?,#W},#[fg=colour227,bold],#{?#{m/r:^■,#W},#[fg=colour102,bold],#{?#{m/r:^↩,#W},#[fg=colour183,bold],#{?#{m/r:^·,#W},#[fg=colour250,bold],#[fg=default,bold]}}}}}}}#W#{?window_zoomed_flag, Z,}#[default] '

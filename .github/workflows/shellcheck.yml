name: shellcheck

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint bin/ scripts
        run: |
          shellcheck -S error \
            bin/claude-window-lib \
            bin/claude-window-init \
            bin/claude-window-ask \
            bin/claude-window-status \
            bin/claude-window-restore \
            bin/claude-window-reset \
            bin/claude-window-subagent \
            bin/claude-window-notify \
            bin/claude-window-session \
            bin/claude-window-compact \
            bin/claude-window-summary \
            bin/claude-window-aggregate \
            bin/claude-window-pane \
            bin/claude-tmux-log \
            bin/claude-tmux-doctor \
            shell/claude-label.bash \
            setup.sh \
            tests/smoke.sh \
            tests/install-uninstall.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y jq fzf tmux

      - name: Run hook smoke harness
        run: bash tests/smoke.sh

      - name: Run install/uninstall harness
        run: bash tests/install-uninstall.sh

  smoke-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      # Install bash >= 4 plus the runtime deps, but keep the BSD userland
      # (awk, date, find, sed) so this job genuinely exercises the macOS code
      # paths: the mkdir-based lock fallback (no flock on stock macOS), the
      # BSD-awk claude-tmux-log --stats program, and the osascript notification
      # branch. Prepending the Homebrew bin to PATH makes `bash` / `env bash`
      # resolve to 4+ while everything else stays BSD. The hook smoke harness
      # stubs tmux/fzf, but the install/uninstall harness runs setup.sh for
      # real, whose preflight requires jq, fzf, and tmux to be present.
      - name: Install bash >= 4 and runtime deps
        run: |
          brew install bash jq fzf tmux
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Confirm bash >= 4
        run: bash -c 'echo "$BASH_VERSION"; (( BASH_VERSINFO[0] >= 4 ))'

      - name: Run hook smoke harness
        run: bash tests/smoke.sh

      - name: Run install/uninstall harness
        run: bash tests/install-uninstall.sh

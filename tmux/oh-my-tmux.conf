# claude-tmux oh-my-tmux configuration
# Merge relevant lines into ~/.tmux.conf.local
#
# Requires: oh-my-tmux (https://github.com/gpakosz/.tmux) and a Nerd Font / Powerline font.
# For vanilla tmux, see plain-tmux.conf instead.

# --- Powerline separators (Nerd Font Unicode) ---
tmux_conf_theme_left_separator_main='\uE0B0'
tmux_conf_theme_left_separator_sub='\uE0B1'
tmux_conf_theme_right_separator_main='\uE0B2'
tmux_conf_theme_right_separator_sub='\uE0B3'

# ASCII fallback (uncomment to use without Nerd Font):
# tmux_conf_theme_left_separator_main='|'
# tmux_conf_theme_left_separator_sub='|'
# tmux_conf_theme_right_separator_main='|'
# tmux_conf_theme_right_separator_sub='|'

# --- Status bar (simplified) ---
tmux_conf_theme_status_left=" ❐ #S "
tmux_conf_theme_status_right=" %R  %d %b  #{?#{m/r:^[^ ]+,#h},#h,} "

# --- Window status colors per claude-tmux state symbol ---
# Uses #{m/r:^SYMBOL,#W} regex match. Remove #{?window_bell_flag,!,} to prevent "! title !" redundancy.
#
# Inactive windows:
tmux_conf_theme_window_status_format='#I #{?#{m/r:^▶,#W},#[fg=colour75],#{?#{m/r:^✓,#W},#[fg=colour76],#{?#{m/r:^!,#W},#[fg=colour196],#{?#{m/r:^?,#W},#[fg=colour220],#{?#{m/r:^■,#W},#[fg=colour239],#{?#{m/r:^↩,#W},#[fg=colour141],#{?#{m/r:^·,#W},#[fg=colour244],#[fg=default]}}}}}}}#W#{?window_zoomed_flag, Z,}'

# Active window:
tmux_conf_theme_window_status_current_format='#I #{?#{m/r:^▶,#W},#[fg=colour75],#{?#{m/r:^✓,#W},#[fg=colour156],#{?#{m/r:^!,#W},#[fg=colour210],#{?#{m/r:^?,#W},#[fg=colour227],#{?#{m/r:^■,#W},#[fg=colour102],#{?#{m/r:^↩,#W},#[fg=colour183],#{?#{m/r:^·,#W},#[fg=colour250],#[fg=default]}}}}}}}#W#{?window_zoomed_flag, Z,}'

# --- Color reference ---
# Symbol  State               Inactive    Active
# ▶       In progress         colour75    colour75  (blue)
# ✓       All complete        colour76    colour156 (green)
# !       Permission prompt   colour196   colour210 (red)
# ?       Waiting for user    colour220   colour227 (gold)
# ■       Stopped             colour239   colour102 (dark gray)
# ↩       Subagent returned   colour141   colour183 (lavender)
# ·       Idle prompt         colour244   colour250 (dim gray)
# ○       Idle/default        default     default

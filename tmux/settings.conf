# claude-tmux required tmux settings
# Source from ~/.tmux.conf or include in oh-my-tmux's tmux.conf.local

# Allow hook scripts to set window names freely
set -g automatic-rename on

# BEL written to pane tty (permission alert) rings in terminal emulator
set -g bell-action any

# Audio-only alert; no screen flash or activity indicators
set -g visual-bell off
set -g visual-activity off
set -g visual-silence off

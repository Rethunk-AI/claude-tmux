# claude-tmux key bindings
# Source from ~/.tmux.conf or include in oh-my-tmux's tmux.conf.local
#
# prefix+f — session picker (overrides oh-my-tmux find-window; available as prefix+:find-window)
# prefix+P — pane picker across all sessions

bind-key f display-popup -E -w 70% -h 50% \
  "bash ~/.local/bin/claude-window-summary"

bind-key P display-popup -E -w 80% -h 60% \
  "tmux list-panes -a -F '#{session_name}:#{window_index}.#{pane_index}\t[#{window_name}] #{b:pane_current_path} (#{pane_current_command})' \
   | fzf --reverse --no-sort --delimiter=$'\\t' --with-nth=2 \
         --header='SESSION:WIN.PANE  [WINDOW] PATH (COMMAND)  — Enter to switch' \
         --prompt='  ' \
   | cut -f1 \
   | xargs -r tmux switch-client -t"
